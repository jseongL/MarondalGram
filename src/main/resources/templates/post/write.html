<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
        
        
        
        <section layout:fragment="contents">
        	<div class="writeTop">
        		<a href="/post/list-view"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTe2sSvQIaxy7gLv7-ZKF40aeAuMoe-sAvZvA&s" alt="backBtn"></a>
        		<span class="text-danger">새 게시물</span>
        	</div>
        	<!-- ---------- -->
        	<div class="writeSlider d-flex">
        		<article class="addImg text-secondary d-flex justify-content-center align-items-center">
        			<img src="" alt="사진추가 버튼">
        			<button class="d-none" id="addPhotoBtn" type="btn">사진추가 버튼</button>
        			<div>사진추가</div>
        		</article>
        		<div>
	        		<input id="titleInput" class="titleText rounded-lg form-control" type="text" placeHolder="제목 입력">
	        		<textarea id="contentsInput" class="writeText rounded-lg form-control" rows="10" type="text" placeHolder="문구추가..."></textarea>
        		</div>
        	</div>
        	<!-- ---------- -->
        	<div class="mt-3 d-flex justify-content-between">
        		<span class="ml-3">사람 태그</span>
        		<span class="mr-3">음악 추가</span>
        	</div>
        	<div class="mt-3 d-flex justify-content-between">
        		<span class="ml-3">위치 추가</span>
        		<span class="mr-3">옵션 더 보기</span>
        	</div>
        	<!-- ---------- -->
        	<button id="shareBtn" class="mt-3 btn btn-danger btn-block">공유하기</button>
        </section>
        
        
        
      	<script layout:fragment="script">
        	$("#shareBtn").on("click", function(){
        		let title = $("#titleInput").val();
        		let contents = $("#contentsInput").val();
        		
        		if(title == ""){
        			alert("제목을 입력하세요.");
        			return ;
        		}
        		if(contents == ""){
        			alert("내용을 입력하세요");
        			return ;
        		}
        		
        		console.log("제목 : " + title + "내용 : " + contents);
        		
        		$.ajax({
        			type:`post`
        			,url:"/post/createProfile"
        			,data:{"title":title, "contents":contents}
        			,success(response){
        				if(response.result == "success"){
        					alert("게시물이 업로드되었습니다");
        					location.href = "/post/list-view";
        				}
        				else{
        					alert("게시물 업로드 실패");
        				}
        			}
        			,error(){
        				alert("게시물 업로드 에러");
        			}
        		});
        		
        		
        		
        		
        		
        		
        		
        	});
      	
        </script>
        
        
        
        
        
        
        
        
        
        
        
        
        
</html>
