      <script layout:fragment="script">
      $(function(){
    	  
    	  
    	  
    	  
    	  
    	  
    	  
    	  $(".comment-btn").on("click", function() {
				let postId = $(this).data("post-id");
				
				// 이벤트가 발생한 버튼에 매칭된 input 태그 객체 
				// let contents = $(this).prev().val();
				let contents = $("#commentInput" + postId).val();
				
				$.ajax({
					type:"post"
					, url:"/post/comment/create"
					, data:{"postId":postId, "contents":contents}
					, success:function(response) {
						if(response.result == "success") {
							location.reload();
						} else {
							alert("댓글 쓰기 실패!");
						}
						
					}
					, error:function() {
						alert("댓글 쓰기 에러!");
					}
				});
				
			});
    	  
    	  
    	  
    	  
    	  $(".dislike-Btn").on("click", function(){
    		  
    		
    		 
    		 let postId = $(this).data("post-id");
    		 
    		 console.log("포스트 아이디 : " + postId);
    		  
    		  $.ajax({
    			 type:`post`
    			 ,url:"/post/like"
    			 ,data:{"postId":postId}
    		  ,success:function(response){
    			  if(response.result == "success"){
    				  location.reload();
    			  }
    			  else{
    				  alert("좋아요 실패");
    			  }
    		  }
    		  ,error:function(){
    			  alert("좋아요 에러");
    		  }
    		  });
    	  });
    	  
    	  
    	  
    	  
    	  
      			$('.listSlider a:gt(0)').hide();
      			setInterval(function(){
      				$('.listSlider a:first-child')
      				.fadeIn(1500)
      				.next('a')
      				.fadeOut(1500)
      				.end()
      				.appendTo('.listSlider');
      			}, 4000);
      			
      			
      			$('.navi>li').mouseover(function(){
      				$(this).find('.submenu').stop().slideDown(500);
      			}).mouseout(function(){
      				$(this).find('.submenu').stop().slideUp(500);
      			});
      			
      			
      			
      			
      			$("#logoutBtn").on("click", function(){
      				if(confirm("로그아웃 하겠습니까?")){
      					location.href = "/user/login-view";
      				}
      				
      			});
      			
      			
      			$("#deleteUserBtn").on("click", function(){
      				if(confirm(" 계정을 탈퇴하시겠습니까?")){
      					
      					alert("탈퇴 완료되었습니다.");
      					location.href = "/user/deleteUser";
      				}
      				
      			});
      			
      			
      			
      			
      			$("#modifyBtn").on("click", function(){
      				location.href = "/post/modify-view";

      			});
      			
      			
      			
      			
      			
      		});
      </script>
