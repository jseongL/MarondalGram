<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
        
       
       <section layout:fragment="contents" class="contents d-flex justify-content-center">
			<div class="user-box my-5 p-5 rounded-lg">
				<h1 class="text-center">회원가입</h1>
				<div class="d-flex">
					<input id="loginIdInput" type="text" class="form-control mt-4 col-9" placeholder="아이디">
					<button type="button" class="btn btn-danger btn-block dubBtn mt-4 ml-1">중복확인</button>
				</div>
				<input id="passwordInput" type="password" class="form-control mt-2" placeholder="비밀번호">
				<input id="passwordConfirmInput" type="password" class="form-control mt-2" placeholder="비밀번호 확인">
				<input id="phoneNumberInput" type="text" class="form-control mt-2" placeholder="전화번호">
				<button id="joinBtn" type="button" class="btn btn-success btn-block mt-3">가입</button>
				
			</div>
		</section>
        
        
        
        
        <script layout:fragment="script">
        	$(function(){
        		$("#joinBtn").on("click", function(){
        			let loginIdInput = $("#loginIdInput").val();
        			let passwordInput = $("#passwordInput").val();
        			let passwordConfirmInput = $("#passwordConfirmInput").val();
        			let phoneNumberInput = $("#phoneNumberInput").val();
        			
        			if(loginIdInput == ""){
        				alert("아이디를 입력하세요");
        				return;
        			}
        			if(passwordInput == ""){
        				alert("비밀번호를 입력하세요");
        				return;
        			}
        			if(passwordInput != passwordConfirmInput){
        				alert("비밀번호가 같지 않습니다");
        				return;
        			}
        			if(phoneNumberInput == ""){
        				alert("전화번호를 입력하세요");
        				return;
        			}
        			
        			
        			
        			$.ajax({
        				type:`post`
        				,url:"/user/join"
        				,data:{"loginId":loginIdInput,"password":passwordInput,"phoneNumber":phoneNumberInput}
        				,success:function(response){
        					if(response.result == "success"){
        						location.href = "/user/login-view";
        					}
        					else{
        						alert("회원가입 실패");
        					}
        				}
        				,error:function(){
        					alert("회원가입 에러");
        				}
        			});
        			
        			
        			
        		});
        	});
        
        </script>
        
        
        
        
        
        
        
        
        
        
        
        
</html>
